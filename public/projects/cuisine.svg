<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Cuisine Classification</title>
  <desc id="desc">Illustration of a machine learning cuisine classification dashboard with food categories.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b1f35"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2942"/><stop offset="1" stop-color="#0a1728"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="50" y="48" width="1100" height="579" rx="28" fill="url(#card)" stroke="#38bdf8" stroke-opacity=".28"/>
  <text x="90" y="105" fill="#38bdf8" font-family="Arial, sans-serif" font-size="24" font-weight="700">MACHINE LEARNING</text>
  <text x="90" y="148" fill="#e8f3fb" font-family="Arial, sans-serif" font-size="38" font-weight="700">Cuisine Classification</text>
  <text x="90" y="184" fill="#9fb2c5" font-family="Arial, sans-serif" font-size="18">Random Forest • Restaurant Dataset • Feature Engineering</text>
  <g transform="translate(90 230)">
    <rect width="650" height="320" rx="20" fill="#06111e" stroke="#38bdf8" stroke-opacity=".16"/>
    <text x="28" y="48" fill="#e8f3fb" font-family="Arial, sans-serif" font-size="20" font-weight="700">Cuisine prediction</text>
    <g font-family="Arial, sans-serif" font-size="16">
      <text x="30" y="90" fill="#9fb2c5">North Indian</text><rect x="180" y="75" width="370" height="18" rx="9" fill="#12354f"/><rect x="180" y="75" width="305" height="18" rx="9" fill="#38bdf8"/><text x="570" y="90" fill="#e8f3fb">82%</text>
      <text x="30" y="140" fill="#9fb2c5">South Indian</text><rect x="180" y="125" width="370" height="18" rx="9" fill="#12354f"/><rect x="180" y="125" width="277" height="18" rx="9" fill="#22d3ee"/><text x="570" y="140" fill="#e8f3fb">75%</text>
      <text x="30" y="190" fill="#9fb2c5">Chinese</text><rect x="180" y="175" width="370" height="18" rx="9" fill="#12354f"/><rect x="180" y="175" width="233" height="18" rx="9" fill="#38bdf8"/><text x="570" y="190" fill="#e8f3fb">63%</text>
      <text x="30" y="240" fill="#9fb2c5">Italian</text><rect x="180" y="225" width="370" height="18" rx="9" fill="#12354f"/><rect x="180" y="225" width="196" height="18" rx="9" fill="#22d3ee"/><text x="570" y="240" fill="#e8f3fb">53%</text>
    </g>
  </g>
  <g transform="translate(785 230)">
    <rect width="310" height="150" rx="20" fill="#06111e" stroke="#38bdf8" stroke-opacity=".16"/>
    <text x="25" y="40" fill="#9fb2c5" font-family="Arial, sans-serif" font-size="16">MODEL</text>
    <text x="25" y="78" fill="#e8f3fb" font-family="Arial, sans-serif" font-size="25" font-weight="700">Random Forest</text>
    <text x="25" y="112" fill="#38bdf8" font-family="Arial, sans-serif" font-size="16">Preprocessing + Training</text>
    <rect x="25" y="130" width="250" height="2" fill="#38bdf8" opacity=".3"/>
  </g>
  <g transform="translate(785 405)">
    <rect width="310" height="145" rx="20" fill="#06111e" stroke="#38bdf8" stroke-opacity=".16"/>
    <text x="25" y="40" fill="#9fb2c5" font-family="Arial, sans-serif" font-size="16">INPUT FEATURES</text>
    <g fill="#bdefff" font-family="Arial, sans-serif" font-size="16">
      <text x="25" y="74">Location</text><text x="145" y="74">Cost</text><text x="220" y="74">Rating</text>
      <text x="25" y="105">Booking</text><text x="145" y="105">Online</text><text x="220" y="105">Votes</text>
    </g>
  </g>
</svg>
